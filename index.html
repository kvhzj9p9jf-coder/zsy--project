<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>简易论坛</title>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #26352d;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 12px 50px;
    }

    /* =========================
       顶部
    ========================= */

    .topbar {
      background: #ffffff;
      border: 1px solid #dcefe3;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 15px rgba(70, 130, 90, 0.06);
    }

    .site-title {
      margin: 0 0 15px;
      font-size: 23px;
      color: #26734a;
    }

    .auth-area {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid #d8e9df;
      border-radius: 10px;
      padding: 11px 12px;
      outline: none;
      background: #ffffff;
      color: #26352d;
    }

    input:focus,
    textarea:focus {
      border-color: #69b987;
      box-shadow: 0 0 0 3px rgba(105, 185, 135, 0.12);
    }

    .auth-input {
      flex: 1 1 180px;
      min-width: 0;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 16px;
      background: #63b783;
      color: white;
      font-weight: 600;
    }

    button:hover {
      background: #4fa66f;
    }

    button.secondary {
      background: #edf8f1;
      color: #31794e;
    }

    button.secondary:hover {
      background: #dff1e5;
    }

    button.danger {
      background: #f2eeee;
      color: #8a5555;
    }

    button.danger:hover {
      background: #eadfdf;
    }

    .user-status {
      margin-top: 10px;
      color: #71857a;
      font-size: 14px;
    }

    /* =========================
       发帖
    ========================= */

    .create-post {
      background: #ffffff;
      border: 1px solid #dcefe3;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 15px rgba(70, 130, 90, 0.06);
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 18px;
      color: #26734a;
    }

    .create-post textarea {
      margin-top: 9px;
      min-height: 130px;
      resize: vertical;
    }

    .create-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }

    /* =========================
       帖子
    ========================= */

    .posts {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .post {
      background: #ffffff;
      border: 1px solid #dcefe3;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 3px 15px rgba(70, 130, 90, 0.05);
    }

    .post-header,
    .comment-header {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    /* 固定绿色头像 */

    .avatar {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 50%;
      background: #63b783;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 17px;
      font-weight: 700;
    }

    .comment .avatar {
      width: 31px;
      height: 31px;
      min-width: 31px;
      font-size: 14px;
    }

    .author {
      font-weight: 700;
      color: #31794e;
    }

    .time {
      margin-top: 2px;
      color: #8b9c92;
      font-size: 12px;
    }

    .post-title {
      margin: 14px 0 8px;
      color: #26352d;
      font-size: 20px;
      line-height: 1.4;
      word-break: break-word;
    }

    .post-content {
      color: #52645a;
      font-size: 15px;
      line-height: 1.75;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* =========================
       评论
    ========================= */

    .comments {
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #edf4ef;
    }

    .comment-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .comment-input-row input {
      flex: 1;
      min-width: 0;
    }

    .comment {
      padding: 10px 0;
      border-bottom: 1px solid #f0f4f1;
    }

    .comment:last-child {
      border-bottom: 0;
    }

    .comment-content {
      margin: 6px 0 0 40px;
      color: #52645a;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* =========================
       状态
    ========================= */

    .empty {
      text-align: center;
      padding: 35px 10px;
      color: #8a9a91;
      border: 1px dashed #d8e9df;
      border-radius: 14px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #759080;
    }

    /* =========================
       弹窗
    ========================= */

    .modal-mask {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(20, 40, 28, 0.25);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal {
      width: 100%;
      max-width: 350px;
      background: #ffffff;
      border-radius: 16px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .modal h3 {
      margin: 0 0 8px;
      color: #31794e;
    }

    .modal p {
      color: #66776d;
      font-size: 14px;
      line-height: 1.6;
    }

    .modal button {
      margin-top: 8px;
      min-width: 100px;
    }

    /* =========================
       手机适配
    ========================= */

    @media (max-width: 600px) {

      .page {
        padding: 10px 9px 35px;
      }

      .topbar,
      .create-post,
      .post {
        border-radius: 13px;
        padding: 13px;
      }

      .auth-area {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .auth-input {
        grid-column: span 2;
      }

      .auth-area button {
        width: 100%;
      }

      .post-title {
        font-size: 18px;
      }

      .comment-input-row {
        flex-direction: column;
      }

      .comment-input-row button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- =========================
       顶部账号区域
  ========================= -->

  <div class="topbar">

    <h1 class="site-title">🌿 简易论坛</h1>

    <div class="auth-area">

      <input
        id="nickname"
        class="auth-input"
        type="text"
        maxlength="30"
        placeholder="昵称"
        autocomplete="username"
      >

      <input
        id="password"
        class="auth-input"
        type="password"
        maxlength="72"
        placeholder="密码"
        autocomplete="current-password"
      >

      <button onclick="register()">注册</button>

      <button onclick="login()">登录</button>

      <button
        class="danger"
        onclick="logout()"
      >
        退出登录
      </button>

    </div>

    <div id="userStatus" class="user-status">
      当前状态：未登录，仅可浏览
    </div>

  </div>


  <!-- =========================
       发帖区域
  ========================= -->

  <div class="create-post">

    <h2 class="section-title">
      发布新帖子
    </h2>

    <input
      id="postTitle"
      type="text"
      maxlength="200"
      placeholder="帖子标题"
    >

    <textarea
      id="postContent"
      maxlength="10000"
      placeholder="写下你想分享的内容..."
    ></textarea>

    <div class="create-actions">

      <button onclick="createPost()">
        发布帖子
      </button>

    </div>

  </div>


  <!-- =========================
       帖子列表
  ========================= -->

  <div id="posts" class="posts">

    <div class="loading">
      正在加载帖子...
    </div>

  </div>

</div>


<!-- =========================
     登录提示弹窗
========================= -->

<div id="modalMask" class="modal-mask">

  <div class="modal">

    <h3>需要登录</h3>

    <p id="modalText">
      登录后才能进行此操作。
    </p>

    <button onclick="closeModal()">
      知道了
    </button>

  </div>

</div>


<script>

/*
============================================================
                    ★★★ 重要 ★★★

          你只需要修改下面这两个地方！

============================================================

① SUPABASE_URL
② SUPABASE_PUBLISHABLE_KEY

其他代码全部不要修改。

============================================================
*/


/* =========================================================
   ① 你的 Supabase URL

   把下面的“需要修改”替换成你自己的 Supabase URL。
   ========================================================= */

const SUPABASE_URL = "https://hgkiypwuftoebuzkfeyh.supabase.co";


/* =========================================================
   ② 你的 Supabase Publishable Key

   把下面的“需要修改”替换成你自己的 Publishable Key。

   ⚠️ 绝对不要填写 Secret Key。
   ⚠️ 绝对不要填写 service_role Key。
   ========================================================= */

const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_MPiE7CxF5KB4sJJhD2_ZUg_wXMHpIJ9";


/*
============================================================
                 ★★★ 配置结束 ★★★
============================================================
*/


/* 初始化 Supabase */

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* 当前用户 */

let currentUser = null;


/* 用户昵称缓存 */

let profileMap = {};


/* =========================================================
   工具函数
========================================================= */

function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function formatTime(time) {

  if (!time) {
    return "";
  }

  const date = new Date(time);

  return date.toLocaleString("zh-CN", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}


function avatarLetter(nickname) {

  if (!nickname) {
    return "?";
  }

  return nickname.trim().charAt(0).toUpperCase();
}


function showModal(message) {

  document.getElementById("modalText").textContent = message;

  document.getElementById("modalMask").style.display = "flex";
}


function closeModal() {

  document.getElementById("modalMask").style.display = "none";
}


function requireLogin() {

  showModal(
    "请先登录账号，然后才能发帖或发表评论。"
  );
}


/* =========================================================
   将昵称转换成内部 Auth 邮箱

   用户看到的仍然只是：

   昵称 + 密码

   用户不需要输入邮箱。
========================================================= */

async function nicknameToAuthEmail(nickname) {

  const data = new TextEncoder().encode(
    nickname.trim().toLowerCase()
  );

  const hashBuffer = await crypto.subtle.digest(
    "SHA-256",
    data
  );

  const hashArray =
    Array.from(new Uint8Array(hashBuffer));

  const hash =
    hashArray
      .map(
        b => b.toString(16).padStart(2, "0")
      )
      .join("");

  return `user-${hash}@forum.local`;
}


/* =========================================================
   注册
========================================================= */

async function register() {

  const nickname =
    document
      .getElementById("nickname")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if (!nickname) {

    showModal("请输入昵称。");

    return;
  }


  if (nickname.length < 2) {

    showModal("昵称至少需要 2 个字符。");

    return;
  }


  if (!password || password.length < 6) {

    showModal("密码至少需要 6 个字符。");

    return;
  }


  try {

    const email =
      await nicknameToAuthEmail(nickname);


    /* 检查昵称是否已经存在 */

    const {
      data: existingProfile,
      error: profileCheckError
    } = await db
      .from("profiles")
      .select("id")
      .eq("nickname", nickname)
      .maybeSingle();


    if (profileCheckError) {

      console.error(profileCheckError);

      showModal(
        "无法检查昵称，请检查 profiles 表和 RLS 设置。"
      );

      return;
    }


    if (existingProfile) {

      showModal(
        "这个昵称已经被注册，请换一个昵称。"
      );

      return;
    }


    /* 创建 Auth 用户 */

    const {
      data,
      error
    } = await db.auth.signUp({

      email: email,

      password: password

    });


    if (error) {

      console.error(error);

      showModal(
        "注册失败：" + error.message
      );

      return;
    }


    if (!data.user) {

      showModal(
        "注册失败，没有创建用户。"
      );

      return;
    }


    /* 创建 profiles */

    const {
      error: insertProfileError
    } = await db
      .from("profiles")
      .insert({

        id: data.user.id,

        nickname: nickname

      });


    if (insertProfileError) {

      console.error(insertProfileError);

      showModal(
        "账号已经创建，但昵称保存失败，请检查 profiles 的 RLS。"
      );

      return;
    }


    currentUser = data.user;

    profileMap[currentUser.id] = nickname;

    updateUserStatus();

    document.getElementById("password").value = "";

    showModal(
      "注册成功，现在可以发帖和评论了。"
    );

    await loadPosts();

  } catch (error) {

    console.error(error);

    showModal(
      "注册过程中发生错误。"
    );

  }
}


/* =========================================================
   登录
========================================================= */

async function login() {

  const nickname =
    document
      .getElementById("nickname")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if (!nickname || !password) {

    showModal(
      "请输入昵称和密码。"
    );

    return;
  }


  try {

    const email =
      await nicknameToAuthEmail(nickname);


    const {
      data,
      error
    } = await db.auth.signInWithPassword({

      email: email,

      password: password

    });


    if (error) {

      console.error(error);

      showModal(
        "登录失败：昵称或密码错误。"
      );

      return;
    }


    currentUser = data.user;

    document.getElementById("password").value = "";

    await loadCurrentProfile();

    updateUserStatus();

    await loadPosts();

  } catch (error) {

    console.error(error);

    showModal(
      "登录过程中发生错误。"
    );

  }
}


/* =========================================================
   退出登录
========================================================= */

async function logout() {

  const {
    error
  } = await db.auth.signOut();


  if (error) {

    console.error(error);

    showModal(
      "退出登录失败：" + error.message
    );

    return;
  }


  currentUser = null;

  profileMap = {};

  updateUserStatus();

  await loadPosts();
}


/* =========================================================
   获取当前用户昵称
========================================================= */

async function loadCurrentProfile() {

  if (!currentUser) {
    return;
  }


  const {
    data,
    error
  } = await db
    .from("profiles")
    .select("id,nickname")
    .eq("id", currentUser.id)
    .maybeSingle();


  if (error) {

    console.error(error);

    return;
  }


  if (data) {

    profileMap[data.id] =
      data.nickname;
  }
}


/* =========================================================
   更新登录状态
========================================================= */

function updateUserStatus() {

  const status =
    document.getElementById("userStatus");


  if (currentUser) {

    const nickname =
      profileMap[currentUser.id] ||
      "已登录用户";


    status.textContent =
      `当前登录：${nickname} · 可以发帖和评论`;

  } else {

    status.textContent =
      "当前状态：未登录，仅可浏览";
  }
}


/* =========================================================
   获取用户昵称
========================================================= */

async function loadProfiles(userIds) {

  const uniqueIds =
    [
      ...new Set(
        userIds.filter(Boolean)
      )
    ];


  if (uniqueIds.length === 0) {
    return;
  }


  const {
    data,
    error
  } = await db
    .from("profiles")
    .select("id,nickname")
    .in("id", uniqueIds);


  if (error) {

    console.error(
      "加载用户资料失败：",
      error
    );

    return;
  }


  for (const profile of data || []) {

    profileMap[profile.id] =
      profile.nickname;
  }
}


/* =========================================================
   加载帖子
========================================================= */

async function loadPosts() {

  const postsContainer =
    document.getElementById("posts");


  postsContainer.innerHTML =
    `<div class="loading">
      正在加载帖子...
    </div>`;


  try {

    /* 获取帖子 */

    const {
      data: postsData,
      error: postsError
    } = await db
      .from("posts")
      .select(
        "id,title,content,author_id,created_at"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (postsError) {

      console.error(postsError);

      postsContainer.innerHTML =
        `<div class="empty">
          帖子加载失败，请检查 Supabase 配置和 RLS。
        </div>`;

      return;
    }


    const posts =
      postsData || [];


    if (posts.length === 0) {

      postsContainer.innerHTML =
        `<div class="empty">
          还没有帖子，来发布第一条吧 🌱
        </div>`;

      return;
    }


    /* 获取发帖人的昵称 */

    await loadProfiles(
      posts.map(
        post => post.author_id
      )
    );


    /* 获取评论 */

    const postIds =
      posts.map(
        post => post.id
      );


    const {
      data: commentsData,
      error: commentsError
    } = await db
      .from("comments")
      .select(
        "id,post_id,content,author_id,created_at"
      )
      .in(
        "post_id",
        postIds
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


    if (commentsError) {

      console.error(
        commentsError
      );
    }


    const comments =
      commentsData || [];


    /* 获取评论用户昵称 */

    await loadProfiles(
      comments.map(
        comment => comment.author_id
      )
    );


    /* 评论按照帖子分类 */

    const commentsByPost = {};


    for (const comment of comments) {

      if (
        !commentsByPost[comment.post_id]
      ) {

        commentsByPost[comment.post_id] = [];
      }


      commentsByPost[comment.post_id]
        .push(comment);
    }


    /* 生成帖子 HTML */

    postsContainer.innerHTML =
      posts
        .map(post => {

          const nickname =
            profileMap[post.author_id] ||
            "未知用户";


          const postComments =
            commentsByPost[post.id] ||
            [];


          let commentsHTML =
            "";


          if (postComments.length === 0) {

            commentsHTML =
              `<div class="time">
                暂无评论
              </div>`;

          } else {

            commentsHTML =
              postComments
                .map(comment => {

                  const commentNickname =
                    profileMap[
                      comment.author_id
                    ] ||
                    "未知用户";


                  return `
                    <div class="comment">

                      <div class="comment-header">

                        <div class="avatar">
                          ${escapeHTML(
                            avatarLetter(
                              commentNickname
                            )
                          )}
                        </div>

                        <div>

                          <div class="author">
                            ${escapeHTML(
                              commentNickname
                            )}
                          </div>

                          <div class="time">
                            ${escapeHTML(
                              formatTime(
                                comment.created_at
                              )
                            )}
                          </div>

                        </div>

                      </div>

                      <div class="comment-content">
                        ${escapeHTML(
                          comment.content
                        )}
                      </div>

                    </div>
                  `;

                })
                .join("");
          }


          return `
            <article class="post">

              <!-- 发帖人 -->

              <div class="post-header">

                <div class="avatar">
                  ${escapeHTML(
                    avatarLetter(
                      nickname
                    )
                  )}
                </div>

                <div>

                  <div class="author">
                    ${escapeHTML(
                      nickname
                    )}
                  </div>

                  <div class="time">
                    ${escapeHTML(
                      formatTime(
                        post.created_at
                      )
                    )}
                  </div>

                </div>

              </div>


              <!-- 标题 -->

              <h2 class="post-title">
                ${escapeHTML(
                  post.title
                )}
              </h2>


              <!-- 正文 -->

              <div class="post-content">
                ${escapeHTML(
                  post.content
                )}
              </div>


              <!-- 评论区域 -->

              <div class="comments">

                ${
                  currentUser

                  ?

                  `
                    <div class="comment-input-row">

                      <input
                        id="comment-${post.id}"
                        type="text"
                        maxlength="5000"
                        placeholder="写下你的评论..."
                      >

                      <button
                        onclick="createComment('${post.id}')"
                      >
                        发送评论
                      </button>

                    </div>
                  `

                  :

                  `
                    <div class="comment-input-row">

                      <input
                        type="text"
                        placeholder="登录后可以发表评论"
                        disabled
                      >

                      <button
                        class="secondary"
                        onclick="requireLogin()"
                      >
                        登录评论
                      </button>

                    </div>
                  `
                }


                ${commentsHTML}

              </div>

            </article>
          `;

        })
        .join("");


  } catch (error) {

    console.error(error);

    postsContainer.innerHTML =
      `<div class="empty">
        加载失败，请检查网络和 Supabase 配置。
      </div>`;
  }
}


/* =========================================================
   发布帖子
========================================================= */

async function createPost() {

  if (!currentUser) {

    requireLogin();

    return;
  }


  const title =
    document
      .getElementById("postTitle")
      .value
      .trim();


  const content =
    document
      .getElementById("postContent")
      .value
      .trim();


  if (!title) {

    showModal(
      "请输入帖子标题。"
    );

    return;
  }


  if (!content) {

    showModal(
      "请输入帖子正文。"
    );

    return;
  }


  const {
    error
  } = await db
    .from("posts")
    .insert({

      title: title,

      content: content,

      author_id: currentUser.id

    });


  if (error) {

    console.error(error);

    showModal(
      "发布失败：" +
      error.message
    );

    return;
  }


  document.getElementById(
    "postTitle"
  ).value = "";


  document.getElementById(
    "postContent"
  ).value = "";


  await loadPosts();
}


/* =========================================================
   发布评论
========================================================= */

async function createComment(postId) {

  if (!currentUser) {

    requireLogin();

    return;
  }


  const input =
    document.getElementById(
      `comment-${postId}`
    );


  if (!input) {
    return;
  }


  const content =
    input.value.trim();


  if (!content) {

    showModal(
      "请输入评论内容。"
    );

    return;
  }


  const {
    error
  } = await db
    .from("comments")
    .insert({

      post_id: postId,

      content: content,

      author_id: currentUser.id

    });


  if (error) {

    console.error(error);

    showModal(
      "评论发送失败：" +
      error.message
    );

    return;
  }


  input.value = "";

  await loadPosts();
}


/* =========================================================
   初始化
========================================================= */

async function init() {

  /* 检查两个配置有没有修改 */

  if (
    SUPABASE_URL === "需要修改" ||
    SUPABASE_PUBLISHABLE_KEY === "需要修改"
  ) {

    document.getElementById(
      "posts"
    ).innerHTML =
      `<div class="empty">
        请先修改 HTML 顶部的
        SUPABASE_URL 和
        SUPABASE_PUBLISHABLE_KEY。
      </div>`;

    return;
  }


  /* 获取登录状态 */

  const {
    data
  } = await db.auth.getSession();


  currentUser =
    data.session
      ? data.session.user
      : null;


  /* 获取用户资料 */

  if (currentUser) {

    await loadCurrentProfile();
  }


  updateUserStatus();

  await loadPosts();


  /* 监听登录状态变化 */

  db.auth.onAuthStateChange(
    async (_event, session) => {

      currentUser =
        session
          ? session.user
          : null;


      if (currentUser) {

        await loadCurrentProfile();
      }


      updateUserStatus();

      await loadPosts();

    }
  );
}


/* 启动 */

init();

</script>
