<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>简易论坛</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #26352d;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 14px 12px 50px;
    }

    /* =========================
       顶部
    ========================= */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      background: #ffffff;
      border: 1px solid #dcefe3;
      border-radius: 16px;

      padding: 14px 16px;
      margin-bottom: 16px;

      box-shadow: 0 3px 15px rgba(70, 130, 90, 0.06);
    }

    .site-title {
      margin: 0;
      font-size: 23px;
      color: #26734a;
    }

    .login-button {
      background: #63b783;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 9px 15px;
      font-weight: 600;
    }

    .login-button:hover {
      background: #4fa66f;
    }

    /* =========================
       用户头像
    ========================= */

    .avatar-button {
      width: 40px;
      height: 40px;

      border-radius: 50%;
      border: 0;

      background: #63b783;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 17px;
      font-weight: 700;

      padding: 0;
    }

    /* =========================
       用户菜单
    ========================= */

    .user-menu {
      position: absolute;

      right: 12px;
      top: 65px;

      width: 230px;

      background: white;

      border: 1px solid #dcefe3;
      border-radius: 14px;

      padding: 14px;

      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);

      display: none;

      z-index: 100;
    }

    .user-menu.show {
      display: block;
    }

    .user-menu-name {
      font-weight: 700;
      color: #31794e;
      margin-bottom: 4px;
    }

    .user-menu-email {
      font-size: 12px;
      color: #8b9c92;
      word-break: break-all;
      margin-bottom: 12px;
    }

    .logout-button {
      width: 100%;

      border: 0;
      border-radius: 9px;

      padding: 9px;

      background: #f2eeee;
      color: #8a5555;

      font-weight: 600;
    }

    .logout-button:hover {
      background: #eadfdf;
    }

    /* =========================
       帖子
    ========================= */

    .create-post,
    .post {
      background: #ffffff;

      border: 1px solid #dcefe3;
      border-radius: 16px;

      padding: 16px;
      margin-bottom: 16px;

      box-shadow: 0 3px 15px rgba(70, 130, 90, 0.05);
    }

    .section-title {
      margin: 0 0 12px;

      font-size: 18px;
      color: #26734a;
    }

    input,
    textarea {
      width: 100%;

      border: 1px solid #d8e9df;
      border-radius: 10px;

      padding: 11px 12px;

      outline: none;

      background: #ffffff;
      color: #26352d;
    }

    input:focus,
    textarea:focus {
      border-color: #69b987;

      box-shadow:
        0 0 0 3px
        rgba(105, 185, 135, 0.12);
    }

    .create-post textarea {
      margin-top: 9px;

      min-height: 130px;

      resize: vertical;
    }

    .create-actions {
      display: flex;

      justify-content: flex-end;

      margin-top: 10px;
    }

    .primary-button {
      border: 0;
      border-radius: 10px;

      padding: 10px 16px;

      background: #63b783;
      color: white;

      font-weight: 600;
    }

    .primary-button:hover {
      background: #4fa66f;
    }

    /* =========================
       帖子头部
    ========================= */

    .post-header,
    .comment-header {
      display: flex;

      align-items: center;

      gap: 9px;
    }

    .avatar {
      width: 38px;
      height: 38px;

      min-width: 38px;

      border-radius: 50%;

      background: #63b783;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;

      font-size: 17px;
      font-weight: 700;
    }

    .comment .avatar {
      width: 31px;
      height: 31px;

      min-width: 31px;

      font-size: 14px;
    }

    .author {
      font-weight: 700;
      color: #31794e;
    }

    .time {
      margin-top: 2px;

      color: #8b9c92;

      font-size: 12px;
    }

    .post-title {
      margin: 14px 0 8px;

      color: #26352d;

      font-size: 20px;

      line-height: 1.4;

      word-break: break-word;
    }

    .post-content {
      color: #52645a;

      font-size: 15px;

      line-height: 1.75;

      white-space: pre-wrap;

      word-break: break-word;
    }

    /* =========================
       帖子操作栏
    ========================= */

    .post-actions {
      display: flex;

      align-items: center;

      gap: 8px;

      margin-top: 16px;
    }

    .like-button {
      border: 1px solid #dcefe3;

      background: #ffffff;

      color: #567263;

      border-radius: 10px;

      padding: 7px 12px;

      font-weight: 600;
    }

    .like-button:hover {
      background: #edf8f1;
    }

    .like-button.liked {
      background: #edf8f1;

      color: #31794e;

      border-color: #b9dec7;
    }

    /* =========================
       评论
    ========================= */

    .comments {
      margin-top: 18px;

      padding-top: 14px;

      border-top: 1px solid #edf4ef;
    }

    .comment-input-row {
      display: flex;

      gap: 8px;

      margin-bottom: 12px;
    }

    .comment-input-row input {
      flex: 1;

      min-width: 0;
    }

    .comment-send {
      white-space: nowrap;
    }

    .comment {
      padding: 10px 0;

      border-bottom: 1px solid #f0f4f1;
    }

    .comment:last-child {
      border-bottom: 0;
    }

    .comment-content {
      margin: 6px 0 0 40px;

      color: #52645a;

      line-height: 1.6;

      white-space: pre-wrap;

      word-break: break-word;
    }

    /* =========================
       状态
    ========================= */

    .empty {
      text-align: center;

      padding: 35px 10px;

      color: #8a9a91;

      border: 1px dashed #d8e9df;

      border-radius: 14px;
    }

    .loading {
      text-align: center;

      padding: 30px;

      color: #759080;
    }

    /* =========================
       登录弹窗
    ========================= */

    .modal-mask {
      display: none;

      position: fixed;

      inset: 0;

      background: rgba(20, 40, 28, 0.25);

      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 999;
    }

    .modal-mask.show {
      display: flex;
    }

    .modal {
      width: 100%;

      max-width: 370px;

      background: white;

      border-radius: 16px;

      padding: 22px;

      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .modal h3 {
      margin: 0 0 15px;

      color: #31794e;

      text-align: center;
    }

    .modal input {
      margin-bottom: 9px;
    }

    .modal-actions {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 8px;

      margin-top: 5px;
    }

    .secondary-button {
      border: 0;

      border-radius: 10px;

      padding: 10px;

      background: #edf8f1;

      color: #31794e;

      font-weight: 600;
    }

    .close-button {
      width: 100%;

      margin-top: 8px;

      border: 0;

      border-radius: 10px;

      padding: 9px;

      background: #f2f4f2;

      color: #66776d;
    }

    .modal-message {
      margin-top: 10px;

      color: #8a5555;

      font-size: 13px;

      line-height: 1.5;

      display: none;
    }

    /* =========================
       手机
    ========================= */

    @media (max-width: 600px) {

      .page {
        padding: 10px 9px 35px;
      }

      .topbar,
      .create-post,
      .post {
        border-radius: 13px;
        padding: 13px;
      }

      .site-title {
        font-size: 20px;
      }

      .comment-input-row {
        flex-direction: column;
      }

      .comment-send {
        width: 100%;
      }

      .post-title {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <!-- =========================
       顶部
  ========================= -->

  <div class="topbar">

    <h1 class="site-title">
      🌿 简易论坛
    </h1>

    <div id="authArea">

      <button
        class="login-button"
        onclick="openLoginModal()"
      >
        登录 / 注册
      </button>

    </div>

  </div>


  <!-- =========================
       发帖
  ========================= -->

  <div class="create-post">

    <h2 class="section-title">
      发布新帖子
    </h2>

    <input
      id="postTitle"
      type="text"
      maxlength="200"
      placeholder="帖子标题"
    >

    <textarea
      id="postContent"
      maxlength="10000"
      placeholder="写下你想分享的内容..."
    ></textarea>

    <div class="create-actions">

      <button
        class="primary-button"
        onclick="createPost()"
      >
        发布帖子
      </button>

    </div>

  </div>


  <!-- =========================
       帖子
  ========================= -->

  <div id="posts">

    <div class="loading">
      正在加载帖子...
    </div>

  </div>

</div>


<!-- =========================
     用户菜单
========================= -->

<div
  id="userMenu"
  class="user-menu"
>

  <div
    id="menuNickname"
    class="user-menu-name"
  >
    用户
  </div>

  <div
    id="menuEmail"
    class="user-menu-email"
  >
    已登录
  </div>

  <button
    class="logout-button"
    onclick="logout()"
  >
    退出登录
  </button>

</div>


<!-- =========================
     登录弹窗
========================= -->

<div
  id="loginModal"
  class="modal-mask"
>

  <div class="modal">

    <h3>
      🌿 登录论坛
    </h3>

    <input
      id="nicknameInput"
      type="text"
      maxlength="30"
      placeholder="昵称"
      autocomplete="username"
    >

    <input
      id="passwordInput"
      type="password"
      maxlength="72"
      placeholder="密码"
      autocomplete="current-password"
    >

    <div class="modal-actions">

      <button
        class="primary-button"
        onclick="login()"
      >
        登录
      </button>

      <button
        class="secondary-button"
        onclick="register()"
      >
        注册
      </button>

    </div>

    <div
      id="loginMessage"
      class="modal-message"
    ></div>

    <button
      class="close-button"
      onclick="closeLoginModal()"
    >
      取消
    </button>

  </div>

</div>


<script>

/* =========================================================
   Supabase 配置
========================================================= */

const SUPABASE_URL =
  "https://hgkiypwuftoebuzkfeyh.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_MPiE7CxF5KB4sJJhD2_ZUg_wXMHpIJ9";


const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   全局变量
========================================================= */

let currentUser = null;

let profileMap = {};


/* =========================================================
   基础工具
========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function avatarLetter(nickname) {

  if (!nickname) {
    return "?";
  }

  return nickname
    .trim()
    .charAt(0)
    .toUpperCase();
}


function formatTime(time) {

  if (!time) {
    return "";
  }

  return new Date(time)
    .toLocaleString(
      "zh-CN",
      {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      }
    );
}


/* =========================================================
   登录弹窗
========================================================= */

function openLoginModal() {

  document
    .getElementById("loginModal")
    .classList.add("show");

  document
    .getElementById("loginMessage")
    .style.display = "none";
}


function closeLoginModal() {

  document
    .getElementById("loginModal")
    .classList.remove("show");
}


function showLoginMessage(message) {

  const box =
    document.getElementById(
      "loginMessage"
    );

  box.textContent = message;

  box.style.display = "block";
}


/* =========================================================
   昵称 → Auth 邮箱
========================================================= */

async function nicknameToAuthEmail(nickname) {

  const data =
    new TextEncoder().encode(
      nickname.trim().toLowerCase()
    );

  const hashBuffer =
    await crypto.subtle.digest(
      "SHA-256",
      data
    );

  const hashArray =
    Array.from(
      new Uint8Array(hashBuffer)
    );

  const hash =
    hashArray
      .map(
        b =>
          b.toString(16)
           .padStart(2, "0")
      )
      .join("");

  return `user-${hash}@forum.local`;
}


/* =========================================================
   注册
========================================================= */

async function register() {

  const nickname =
    document
      .getElementById("nicknameInput")
      .value
      .trim();

  const password =
    document
      .getElementById("passwordInput")
      .value;


  if (!nickname) {

    showLoginMessage(
      "请输入昵称。"
    );

    return;
  }


  if (nickname.length < 2) {

    showLoginMessage(
      "昵称至少需要 2 个字符。"
    );

    return;
  }


  if (
    !password ||
    password.length < 6
  ) {

    showLoginMessage(
      "密码至少需要 6 个字符。"
    );

    return;
  }


  try {

    const email =
      await nicknameToAuthEmail(
        nickname
      );


    /* 检查昵称 */

    const {
      data: existing,
      error: checkError
    } = await db
      .from("profiles")
      .select("id")
      .eq(
        "nickname",
        nickname
      )
      .maybeSingle();


    if (checkError) {

      console.error(
        checkError
      );

      showLoginMessage(
        "检查昵称失败：" +
        checkError.message
      );

      return;
    }


    if (existing) {

      showLoginMessage(
        "这个昵称已经被注册。"
      );

      return;
    }


    /* 注册 Auth */

    const {
      data,
      error
    } =
      await db.auth.signUp({

        email: email,

        password: password

      });


    if (error) {

      console.error(error);

      showLoginMessage(
        "注册失败：" +
        error.message
      );

      return;
    }


    if (!data.user) {

      showLoginMessage(
        "注册失败，没有创建用户。"
      );

      return;
    }


    /* 创建 profile */

    const {
      error:
        profileError
    } =
      await db
        .from("profiles")
        .insert({

          id: data.user.id,

          nickname: nickname

        });


    if (profileError) {

      console.error(
        profileError
      );

      showLoginMessage(
        "账号创建成功，但昵称保存失败：" +
        profileError.message
      );

      return;
    }


    currentUser = data.user;

    profileMap[
      currentUser.id
    ] = nickname;


    updateAuthUI();

    closeLoginModal();

    await loadPosts();

  } catch (error) {

    console.error(error);

    showLoginMessage(
      "注册过程中发生错误：" +
      error.message
    );
  }
}


/* =========================================================
   登录
========================================================= */

async function login() {

  const nickname =
    document
      .getElementById("nicknameInput")
      .value
      .trim();

  const password =
    document
      .getElementById("passwordInput")
      .value;


  if (
    !nickname ||
    !password
  ) {

    showLoginMessage(
      "请输入昵称和密码。"
    );

    return;
  }


  try {

    const email =
      await nicknameToAuthEmail(
        nickname
      );


    const {
      data,
      error
    } =
      await db.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      console.error(error);

      showLoginMessage(
        "登录失败：昵称或密码错误。"
      );

      return;
    }


    currentUser = data.user;


    await loadCurrentProfile();


    updateAuthUI();

    closeLoginModal();

    await loadPosts();

  } catch (error) {

    console.error(error);

    showLoginMessage(
      "登录失败：" +
      error.message
    );
  }
}


/* =========================================================
   获取当前 profile
========================================================= */

async function loadCurrentProfile() {

  if (!currentUser) {
    return;
  }


  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select(
        "id,nickname"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();


  if (error) {

    console.error(
      "加载用户资料失败：",
      error
    );

    return;
  }


  if (data) {

    profileMap[
      data.id
    ] = data.nickname;
  }
}


/* =========================================================
   顶部登录状态
========================================================= */

function updateAuthUI() {

  const area =
    document.getElementById(
      "authArea"
    );


  if (!currentUser) {

    area.innerHTML = `
      <button
        class="login-button"
        onclick="openLoginModal()"
      >
        登录 / 注册
      </button>
    `;

    return;
  }


  const nickname =
    profileMap[
      currentUser.id
    ] || "用户";


  area.innerHTML = `
    <button
      class="avatar-button"
      onclick="toggleUserMenu()"
      title="${escapeHTML(nickname)}"
    >
      ${escapeHTML(
        avatarLetter(nickname)
      )}
    </button>
  `;


  document.getElementById(
    "menuNickname"
  ).textContent = nickname;


  document.getElementById(
    "menuEmail"
  ).textContent =
    "已登录";
}


/* =========================================================
   用户菜单
========================================================= */

function toggleUserMenu() {

  document
    .getElementById("userMenu")
    .classList.toggle("show");
}


/* =========================================================
   退出登录
========================================================= */

async function logout() {

  const {
    error
  } = await db.auth.signOut();


  if (error) {

    alert(
      "退出登录失败：" +
      error.message
    );

    return;
  }


  currentUser = null;

  profileMap = {};


  document
    .getElementById("userMenu")
    .classList.remove("show");


  updateAuthUI();

  await loadPosts();
}


/* =========================================================
   获取用户昵称
========================================================= */

async function loadProfiles(
  userIds
) {

  const uniqueIds =
    [
      ...new Set(
        userIds.filter(Boolean)
      )
    ];


  if (
    uniqueIds.length === 0
  ) {

    return;
  }


  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select(
        "id,nickname"
      )
      .in(
        "id",
        uniqueIds
      );


  if (error) {

    console.error(
      "加载昵称失败：",
      error
    );

    return;
  }


  for (
    const profile of data || []
  ) {

    profileMap[
      profile.id
    ] = profile.nickname;
  }
}


/* =========================================================
   加载帖子
========================================================= */

async function loadPosts() {

  const container =
    document.getElementById(
      "posts"
    );


  container.innerHTML = `
    <div class="loading">
      正在加载帖子...
    </div>
  `;


  try {

    /* 获取帖子 */

    const {
      data: posts,
      error: postsError
    } =
      await db
        .from("posts")
        .select(
          "id,title,content,author_id,created_at"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (postsError) {

      console.error(
        postsError
      );

      container.innerHTML = `
        <div class="empty">
          帖子加载失败：
          ${escapeHTML(
            postsError.message
          )}
        </div>
      `;

      return;
    }


    if (
      !posts ||
      posts.length === 0
    ) {

      container.innerHTML = `
        <div class="empty">
          还没有帖子，来发布第一条吧 🌱
        </div>
      `;

      return;
    }


    /* 获取昵称 */

    await loadProfiles(
      posts.map(
        post =>
          post.author_id
      )
    );


    /* 获取评论 */

    const postIds =
      posts.map(
        post => post.id
      );


    const {
      data: comments,
      error: commentsError
    } =
      await db
        .from("comments")
        .select(
          "id,post_id,content,author_id,created_at"
        )
        .in(
          "post_id",
          postIds
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (commentsError) {

      console.error(
        "评论加载失败：",
        commentsError
      );
    }


    /* 获取评论昵称 */

    await loadProfiles(
      (comments || []).map(
        comment =>
          comment.author_id
      )
    );


    /* 获取点赞 */

    const {
      data: likes,
      error: likesError
    } =
      await db
        .from("likes")
        .select(
          "id,post_id,user_id"
        )
        .in(
          "post_id",
          postIds
        );


    if (likesError) {

      console.error(
        "点赞加载失败：",
        likesError
      );
    }


    const commentList =
      comments || [];

    const likeList =
      likes || [];


    /* 按帖子分类评论 */

    const commentsByPost = {};


    for (
      const comment of commentList
    ) {

      if (
        !commentsByPost[
          comment.post_id
        ]
      ) {

        commentsByPost[
          comment.post_id
        ] = [];
      }


      commentsByPost[
        comment.post_id
      ].push(comment);
    }


    /* 按帖子统计点赞 */

    const likesByPost = {};


    for (
      const like of likeList
    ) {

      if (
        !likesByPost[
          like.post_id
        ]
      ) {

        likesByPost[
          like.post_id
        ] = [];
      }


      likesByPost[
        like.post_id
      ].push(like);
    }


    /* 生成 HTML */

    container.innerHTML =
      posts.map(
        post => {

          const nickname =
            profileMap[
              post.author_id
            ] ||
            "未知用户";


          const postComments =
            commentsByPost[
              post.id
            ] || [];


          const postLikes =
            likesByPost[
              post.id
            ] || [];


          const likeCount =
            postLikes.length;


          const hasLiked =
            currentUser
              ? postLikes.some(
                  like =>
                    like.user_id ===
                    currentUser.id
                )
              : false;


          let commentsHTML = "";


          if (
            postComments.length === 0
          ) {

            commentsHTML = `
              <div class="time">
                暂无评论
              </div>
            `;

          } else {

            commentsHTML =
              postComments
                .map(
                  comment => {

                    const commentNickname =
                      profileMap[
                        comment.author_id
                      ] ||
                      "未知用户";


                    return `
                      <div class="comment">

                        <div class="comment-header">

                          <div class="avatar">
                            ${escapeHTML(
                              avatarLetter(
                                commentNickname
                              )
                            )}
                          </div>

                          <div>

                            <div class="author">
                              ${escapeHTML(
                                commentNickname
                              )}
                            </div>

                            <div class="time">
                              ${escapeHTML(
                                formatTime(
                                  comment.created_at
                                )
                              )}
                            </div>

                          </div>

                        </div>

                        <div class="comment-content">
                          ${escapeHTML(
                            comment.content
                          )}
                        </div>

                      </div>
                    `;
                  }
                )
                .join("");
          }


          return `
            <article class="post">

              <div class="post-header">

                <div class="avatar">
                  ${escapeHTML(
                    avatarLetter(
                      nickname
                    )
                  )}
                </div>

                <div>

                  <div class="author">
                    ${escapeHTML(
                      nickname
                    )}
                  </div>

                  <div class="time">
                    ${escapeHTML(
                      formatTime(
                        post.created_at
                      )
                    )}
                  </div>

                </div>

              </div>


              <h2 class="post-title">
                ${escapeHTML(
                  post.title
                )}
              </h2>


              <div class="post-content">
                ${escapeHTML(
                  post.content
                )}
              </div>


              <div class="post-actions">

                <button
                  class="like-button ${
                    hasLiked
                      ? "liked"
                      : ""
                  }"
                  onclick="toggleLike(${post.id})"
                >
                  ${
                    hasLiked
                      ? "♥"
                      : "♡"
                  }
                  ${likeCount}
                </button>

              </div>


              <div class="comments">

                ${
                  currentUser

                    ? `

                      <div class="comment-input-row">

                        <input
                          id="comment-input-${post.id}"
                          type="text"
                          maxlength="5000"
                          placeholder="写下你的评论..."
                          onkeydown="
                            if(event.key === 'Enter'){
                              event.preventDefault();
                              createComment(${post.id});
                            }
                          "
                        >

                        <button
                          class="primary-button comment-send"
                          onclick="createComment(${post.id})"
                        >
                          发送评论
                        </button>

                      </div>

                    `

                    : `

                      <div class="comment-input-row">

                        <input
                          type="text"
                          placeholder="登录后可以发表评论"
                          disabled
                        >

                        <button
                          class="secondary-button comment-send"
                          onclick="openLoginModal()"
                        >
                          登录评论
                        </button>

                      </div>

                    `
                }


                ${commentsHTML}

              </div>

            </article>
          `;
        }
      ).join("");


  } catch (error) {

    console.error(
      "加载页面失败：",
      error
    );

    container.innerHTML = `
      <div class="empty">
        页面加载失败：
        ${escapeHTML(
          error.message
        )}
      </div>
    `;
  }
}


/* =========================================================
   发布帖子
========================================================= */

async function createPost() {

  if (!currentUser) {

    openLoginModal();

    return;
  }


  const title =
    document
      .getElementById(
        "postTitle"
      )
      .value
      .trim();


  const content =
    document
      .getElementById(
        "postContent"
      )
      .value
      .trim();


  if (!title) {

    alert(
      "请输入帖子标题。"
    );

    return;
  }


  if (!content) {

    alert(
      "请输入帖子正文。"
    );

    return;
  }


  const {
    error
  } =
    await db
      .from("posts")
      .insert({

        title: title,

        content: content,

        author_id:
          currentUser.id

      });


  if (error) {

    console.error(error);

    alert(
      "发布失败：" +
      error.message
    );

    return;
  }


  document.getElementById(
    "postTitle"
  ).value = "";


  document.getElementById(
    "postContent"
  ).value = "";


  await loadPosts();
}


/* =========================================================
   ⭐ 发布评论
========================================================= */

async function createComment(
  postId
) {

  console.log(
    "createComment 被调用，postId =",
    postId
  );


  /* ① 检查登录 */

  if (!currentUser) {

    openLoginModal();

    return;
  }


  /* ② 找到评论输入框 */

  const input =
    document.getElementById(
      `comment-input-${postId}`
    );


  if (!input) {

    alert(
      "找不到评论输入框，请刷新网页后重试。"
    );

    console.error(
      "找不到 input:",
      `comment-input-${postId}`
    );

    return;
  }


  /* ③ 获取内容 */

  const content =
    input.value.trim();


  if (!content) {

    alert(
      "请输入评论内容。"
    );

    input.focus();

    return;
  }


  /* ④ 暂时禁用按钮 */

  const button =
    input
      .parentElement
      .querySelector(
        "button"
      );


  if (button) {

    button.disabled = true;

    button.textContent =
      "发送中...";
  }


  try {

    /* ⑤ 写入 comments */

    const {
      error
    } =
      await db
        .from("comments")
        .insert({

          post_id: postId,

          content: content,

          author_id:
            currentUser.id

        });


    /* ⑥ 检查数据库错误 */

    if (error) {

      console.error(
        "评论写入失败：",
        error
      );

      alert(
        "评论发送失败：\n" +
        error.message
      );

      return;
    }


    /* ⑦ 成功 */

    input.value = "";


    await loadPosts();


  } catch (error) {

    console.error(
      "评论发生异常：",
      error
    );

    alert(
      "评论发送失败：\n" +
      error.message
    );

  } finally {

    if (button) {

      button.disabled = false;

      button.textContent =
        "发送评论";
    }
  }
}


/* =========================================================
   ⭐ 点赞 / 取消点赞
========================================================= */

async function toggleLike(
  postId
) {

  if (!currentUser) {

    openLoginModal();

    return;
  }


  try {

    /* 检查是否已经点赞 */

    const {
      data: existing,
      error: checkError
    } =
      await db
        .from("likes")
        .select("id")
        .eq(
          "post_id",
          postId
        )
        .eq(
          "user_id",
          currentUser.id
        )
        .maybeSingle();


    if (checkError) {

      console.error(
        checkError
      );

      alert(
        "检查点赞失败：" +
        checkError.message
      );

      return;
    }


    /* 已经点赞 → 取消 */

    if (existing) {

      const {
        error
      } =
        await db
          .from("likes")
          .delete()
          .eq(
            "id",
            existing.id
          );


      if (error) {

        console.error(error);

        alert(
          "取消点赞失败：" +
          error.message
        );

        return;
      }


    } else {

      /* 没有点赞 → 点赞 */

      const {
        error
      } =
        await db
          .from("likes")
          .insert({

            post_id: postId,

            user_id:
              currentUser.id

          });


      if (error) {

        console.error(error);

        alert(
          "点赞失败：" +
          error.message
        );

        return;
      }
    }


    await loadPosts();

  } catch (error) {

    console.error(
      error
    );

    alert(
      "点赞操作失败：" +
      error.message
    );
  }
}


/* =========================================================
   初始化
========================================================= */

async function init() {

  try {

    const {
      data
    } =
      await db.auth.getSession();


    currentUser =
      data.session
        ? data.session.user
        : null;


    if (currentUser) {

      await loadCurrentProfile();
    }


    updateAuthUI();

    await loadPosts();


    /* 监听登录状态 */

    db.auth.onAuthStateChange(
      async (
        _event,
        session
      ) => {

        currentUser =
          session
            ? session.user
            : null;


        if (currentUser) {

          await loadCurrentProfile();
        }


        updateAuthUI();

        await loadPosts();

      }
    );


  } catch (error) {

    console.error(
      "初始化失败：",
      error
    );

    document.getElementById(
      "posts"
    ).innerHTML = `
      <div class="empty">
        初始化失败：
        ${escapeHTML(
          error.message
        )}
      </div>
    `;
  }
}


/* =========================================================
   点击页面其他地方时关闭用户菜单
========================================================= */

document.addEventListener(
  "click",
  function(event) {

    const menu =
      document.getElementById(
        "userMenu"
      );

    const authArea =
      document.getElementById(
        "authArea"
      );


    if (
      menu.classList.contains("show") &&
      !menu.contains(event.target) &&
      !authArea.contains(event.target)
    ) {

      menu.classList.remove(
        "show"
      );
    }

  }
);


/* 启动 */

init();

</script>
