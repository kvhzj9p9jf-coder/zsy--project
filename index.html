<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>简易论坛</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #26352d;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang SC",
        "Hiragino Sans GB",
        "Microsoft YaHei",
        sans-serif;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    /* =========================
       页面
    ========================= */

    .page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 16px 12px 50px;
    }


    /* =========================
       登录页面
    ========================= */

    #authPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #f8fcf9;
    }

    .auth-card {
      width: 100%;
      max-width: 390px;
      background: white;
      border: 1px solid #dcefe3;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(70, 130, 90, 0.08);
    }

    .auth-logo {
      text-align: center;
      font-size: 30px;
      margin-bottom: 5px;
    }

    .auth-title {
      text-align: center;
      color: #26734a;
      margin: 0 0 5px;
      font-size: 25px;
    }

    .auth-subtitle {
      text-align: center;
      color: #8a9a91;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .auth-card input {
      margin-bottom: 10px;
    }

    .auth-card button {
      width: 100%;
      margin-top: 5px;
    }

    .switch-auth {
      margin-top: 15px;
      text-align: center;
      color: #71857a;
      font-size: 14px;
    }

    .switch-auth button {
      width: auto;
      margin: 0;
      padding: 0;
      background: transparent;
      color: #31794e;
    }


    /* =========================
       顶部
    ========================= */

    .topbar {
      background: #ffffff;
      border: 1px solid #dcefe3;
      border-radius: 16px;
      padding: 14px 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 15px rgba(70, 130, 90, 0.06);

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .site-title {
      margin: 0;
      font-size: 23px;
      color: #26734a;
    }

    .site-subtitle {
      margin-top: 3px;
      font-size: 12px;
      color: #8b9c92;
    }


    /* =========================
       头像按钮
    ========================= */

    .profile-wrapper {
      position: relative;
    }

    .profile-button {
      width: 42px;
      height: 42px;
      min-width: 42px;

      border-radius: 50%;
      padding: 0;

      background: #63b783;
      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 18px;
      font-weight: 700;
    }

    .profile-button:hover {
      background: #4fa66f;
    }

    .profile-menu {
      display: none;

      position: absolute;
      right: 0;
      top: 50px;

      width: 220px;

      background: white;
      border: 1px solid #dcefe3;
      border-radius: 14px;

      padding: 15px;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.12);

      z-index: 100;
    }

    .profile-menu.show {
      display: block;
    }

    .profile-menu-name {
      font-weight: 700;
      color: #31794e;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .profile-menu-email {
      font-size: 11px;
      color: #9aa89f;
      word-break: break-all;
      margin-bottom: 12px;
    }

    .profile-menu button {
      width: 100%;
    }


    /* =========================
       发帖
    ========================= */

    .create-post {
      background: #ffffff;
      border: 1px solid #dcefe3;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 3px 15px rgba(70, 130, 90, 0.06);
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 18px;
      color: #26734a;
    }

    .create-post textarea {
      margin-top: 9px;
      min-height: 130px;
      resize: vertical;
    }

    .create-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 10px;
    }


    /* =========================
       帖子
    ========================= */

    .posts {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .post {
      background: #ffffff;
      border: 1px solid #dcefe3;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 3px 15px rgba(70, 130, 90, 0.05);
    }

    .post-header,
    .comment-header {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .avatar {
      width: 38px;
      height: 38px;
      min-width: 38px;

      border-radius: 50%;

      background: #63b783;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      font-size: 17px;
      font-weight: 700;
    }

    .comment .avatar {
      width: 31px;
      height: 31px;
      min-width: 31px;
      font-size: 14px;
    }

    .author {
      font-weight: 700;
      color: #31794e;
    }

    .time {
      margin-top: 2px;
      color: #8b9c92;
      font-size: 12px;
    }

    .post-title {
      margin: 14px 0 8px;

      color: #26352d;
      font-size: 20px;
      line-height: 1.4;

      word-break: break-word;
    }

    .post-content {
      color: #52645a;
      font-size: 15px;
      line-height: 1.75;

      white-space: pre-wrap;
      word-break: break-word;
    }


    /* =========================
       操作栏
    ========================= */

    .post-actions {
      display: flex;
      align-items: center;
      gap: 8px;

      margin-top: 15px;
      padding-top: 12px;

      border-top: 1px solid #edf4ef;
    }

    .like-button {
      background: #f4faf6;
      color: #4c765d;

      padding: 7px 12px;

      border: 1px solid #e1eee5;
      border-radius: 9px;

      font-weight: 500;
    }

    .like-button:hover {
      background: #e6f5eb;
    }

    .like-button.liked {
      background: #e1f4e7;
      color: #26734a;
      border-color: #bfe2ca;
    }

    .like-count {
      margin-left: 3px;
    }


    /* =========================
       评论
    ========================= */

    .comments {
      margin-top: 15px;
      padding-top: 14px;
      border-top: 1px solid #edf4ef;
    }

    .comment-input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .comment-input-row input {
      flex: 1;
      min-width: 0;
    }

    .comment {
      padding: 10px 0;
      border-bottom: 1px solid #f0f4f1;
    }

    .comment:last-child {
      border-bottom: 0;
    }

    .comment-content {
      margin: 6px 0 0 40px;
      color: #52645a;
      line-height: 1.6;

      white-space: pre-wrap;
      word-break: break-word;
    }


    /* =========================
       状态
    ========================= */

    .empty {
      text-align: center;
      padding: 35px 10px;

      color: #8a9a91;

      border: 1px dashed #d8e9df;
      border-radius: 14px;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #759080;
    }


    /* =========================
       弹窗
    ========================= */

    .modal-mask {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(20, 40, 28, 0.25);

      align-items: center;
      justify-content: center;

      padding: 20px;

      z-index: 999;
    }

    .modal {
      width: 100%;
      max-width: 350px;

      background: white;

      border-radius: 16px;

      padding: 22px;

      text-align: center;

      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.15);
    }

    .modal h3 {
      margin: 0 0 8px;
      color: #31794e;
    }

    .modal p {
      color: #66776d;
      font-size: 14px;
      line-height: 1.6;
    }

    .modal button {
      margin-top: 8px;
      min-width: 100px;
    }


    /* =========================
       手机
    ========================= */

    @media (max-width: 600px) {

      .page {
        padding: 10px 9px 35px;
      }

      .topbar,
      .create-post,
      .post {
        border-radius: 13px;
        padding: 13px;
      }

      .site-title {
        font-size: 20px;
      }

      .post-title {
        font-size: 18px;
      }

      .comment-input-row {
        flex-direction: column;
      }

      .comment-input-row button {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<!-- =====================================================
     登录 / 注册页面
===================================================== -->

<div id="authPage">

  <div class="auth-card">

    <div class="auth-logo">
      🌿
    </div>

    <h1 class="auth-title">
      简易论坛
    </h1>

    <div class="auth-subtitle" id="authSubtitle">
      登录后开始交流
    </div>


    <input
      id="authNickname"
      type="text"
      maxlength="30"
      placeholder="昵称"
      autocomplete="username"
    >


    <input
      id="authPassword"
      type="password"
      maxlength="72"
      placeholder="密码（至少 6 位）"
      autocomplete="current-password"
    >


    <button
      id="authMainButton"
      onclick="handleAuth()"
    >
      登录
    </button>


    <div class="switch-auth">

      <span id="switchText">
        还没有账号？
      </span>

      <button
        onclick="switchAuthMode()"
        id="switchButton"
      >
        注册账号
      </button>

    </div>

  </div>

</div>



<!-- =====================================================
     论坛页面
===================================================== -->

<div id="forumPage" style="display:none;">

  <div class="page">


    <!-- 顶部 -->

    <div class="topbar">

      <div>

        <h1 class="site-title">
          🌿 简易论坛
        </h1>

        <div class="site-subtitle">
          分享你的想法
        </div>

      </div>


      <!-- 右上角头像 -->

      <div class="profile-wrapper">

        <button
          class="profile-button"
          onclick="toggleProfileMenu()"
          id="profileAvatar"
        >
          ?
        </button>


        <div
          class="profile-menu"
          id="profileMenu"
        >

          <div
            class="profile-menu-name"
            id="profileMenuName"
          >
            用户
          </div>

          <div
            class="profile-menu-email"
            id="profileMenuEmail"
          >
          </div>

          <button
            class="danger"
            onclick="logout()"
          >
            退出登录
          </button>

        </div>

      </div>

    </div>


    <!-- 发帖 -->

    <div class="create-post">

      <h2 class="section-title">
        发布新帖子
      </h2>


      <input
        id="postTitle"
        type="text"
        maxlength="200"
        placeholder="帖子标题"
      >


      <textarea
        id="postContent"
        maxlength="10000"
        placeholder="写下你想分享的内容..."
      ></textarea>


      <div class="create-actions">

        <button onclick="createPost()">
          发布帖子
        </button>

      </div>

    </div>


    <!-- 帖子 -->

    <div
      id="posts"
      class="posts"
    >

      <div class="loading">
        正在加载帖子...
      </div>

    </div>

  </div>

</div>



<!-- =====================================================
     弹窗
===================================================== -->

<div
  id="modalMask"
  class="modal-mask"
>

  <div class="modal">

    <h3>
      提示
    </h3>

    <p id="modalText">
      操作失败。
    </p>

    <button onclick="closeModal()">
      知道了
    </button>

  </div>

</div>



<script>


/* =========================================================
   Supabase 配置
========================================================= */

const SUPABASE_URL =
  "https://hgkiypwuftoebuzkfeyh.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_MPiE7CxF5KB4sJJhD2_ZUg_wXMHpIJ9";


const { createClient } = supabase;


const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   全局变量
========================================================= */

let currentUser = null;

let profileMap = {};

let likedPostIds = new Set();

let authMode = "login";


/* =========================================================
   工具
========================================================= */

function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function formatTime(time) {

  if (!time) {
    return "";
  }

  return new Date(time).toLocaleString(
    "zh-CN",
    {
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}


function avatarLetter(nickname) {

  if (!nickname) {
    return "?";
  }

  return nickname
    .trim()
    .charAt(0)
    .toUpperCase();
}


function showModal(message) {

  document.getElementById(
    "modalText"
  ).textContent = message;

  document.getElementById(
    "modalMask"
  ).style.display = "flex";
}


function closeModal() {

  document.getElementById(
    "modalMask"
  ).style.display = "none";
}


/* =========================================================
   昵称 → 内部邮箱
========================================================= */

async function nicknameToAuthEmail(nickname) {

  const data =
    new TextEncoder().encode(
      nickname.trim().toLowerCase()
    );


  const hashBuffer =
    await crypto.subtle.digest(
      "SHA-256",
      data
    );


  const hashArray =
    Array.from(
      new Uint8Array(hashBuffer)
    );


  const hash =
    hashArray
      .map(
        b =>
          b
            .toString(16)
            .padStart(2, "0")
      )
      .join("");


  return `user-${hash}@forum.local`;
}


/* =========================================================
   登录 / 注册模式切换
========================================================= */

function switchAuthMode() {

  if (authMode === "login") {

    authMode = "register";

    document.getElementById(
      "authSubtitle"
    ).textContent =
      "创建账号后开始交流";

    document.getElementById(
      "authMainButton"
    ).textContent =
      "注册";

    document.getElementById(
      "switchText"
    ).textContent =
      "已经有账号？";

    document.getElementById(
      "switchButton"
    ).textContent =
      "返回登录";

  } else {

    authMode = "login";

    document.getElementById(
      "authSubtitle"
    ).textContent =
      "登录后开始交流";

    document.getElementById(
      "authMainButton"
    ).textContent =
      "登录";

    document.getElementById(
      "switchText"
    ).textContent =
      "还没有账号？";

    document.getElementById(
      "switchButton"
    ).textContent =
      "注册账号";
  }
}


/* =========================================================
   登录 / 注册
========================================================= */

async function handleAuth() {

  const nickname =
    document
      .getElementById("authNickname")
      .value
      .trim();


  const password =
    document
      .getElementById("authPassword")
      .value;


  if (!nickname) {

    showModal("请输入昵称。");

    return;
  }


  if (nickname.length < 2) {

    showModal("昵称至少需要 2 个字符。");

    return;
  }


  if (!password) {

    showModal("请输入密码。");

    return;
  }


  if (password.length < 6) {

    showModal("密码至少需要 6 个字符。");

    return;
  }


  const email =
    await nicknameToAuthEmail(
      nickname
    );


  /* ======================
     注册
  ====================== */

  if (authMode === "register") {

    try {

      const {
        data: existing,
        error: checkError
      } = await db
        .from("profiles")
        .select("id")
        .eq("nickname", nickname)
        .maybeSingle();


      if (checkError) {

        console.error(checkError);

        showModal(
          "检查昵称失败：" +
          checkError.message
        );

        return;
      }


      if (existing) {

        showModal(
          "这个昵称已经被注册。"
        );

        return;
      }


      const {
        data,
        error
      } =
        await db.auth.signUp({

          email: email,

          password: password

        });


      if (error) {

        console.error(error);

        showModal(
          "注册失败：" +
          error.message
        );

        return;
      }


      if (!data.user) {

        showModal(
          "注册失败，没有创建用户。"
        );

        return;
      }


      const {
        error: profileError
      } =
        await db
          .from("profiles")
          .insert({

            id: data.user.id,

            nickname: nickname

          });


      if (profileError) {

        console.error(
          profileError
        );

        showModal(
          "账号创建成功，但昵称保存失败。\n\n" +
          "请检查 Supabase 的 profiles INSERT RLS 权限。"
        );

        return;
      }


      currentUser =
        data.user;


      profileMap[
        currentUser.id
      ] = nickname;


      document.getElementById(
        "authPassword"
      ).value = "";


      showForum();


    } catch (error) {

      console.error(error);

      showModal(
        "注册过程中发生错误。"
      );
    }

    return;
  }


  /* ======================
     登录
  ====================== */

  try {

    const {
      data,
      error
    } =
      await db.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      console.error(error);

      showModal(
        "登录失败：昵称或密码错误。"
      );

      return;
    }


    currentUser =
      data.user;


    document.getElementById(
      "authPassword"
    ).value = "";


    await loadCurrentProfile();


    showForum();


  } catch (error) {

    console.error(error);

    showModal(
      "登录过程中发生错误。"
    );
  }
}


/* =========================================================
   显示论坛
========================================================= */

async function showForum() {

  document.getElementById(
    "authPage"
  ).style.display = "none";


  document.getElementById(
    "forumPage"
  ).style.display = "block";


  updateProfileButton();


  await loadPosts();
}


/* =========================================================
   显示登录页
========================================================= */

function showAuth() {

  document.getElementById(
    "forumPage"
  ).style.display = "none";


  document.getElementById(
    "authPage"
  ).style.display = "flex";
}


/* =========================================================
   当前用户资料
========================================================= */

async function loadCurrentProfile() {

  if (!currentUser) {
    return;
  }


  const {
    data,
    error
  } = await db
    .from("profiles")
    .select(
      "id,nickname"
    )
    .eq(
      "id",
      currentUser.id
    )
    .maybeSingle();


  if (error) {

    console.error(error);

    return;
  }


  if (data) {

    profileMap[data.id] =
      data.nickname;
  }
}


/* =========================================================
   更新右上角头像
========================================================= */

function updateProfileButton() {

  const nickname =
    currentUser
      ? (
          profileMap[
            currentUser.id
          ] || "?"
        )
      : "?";


  document.getElementById(
    "profileAvatar"
  ).textContent =
    avatarLetter(nickname);


  document.getElementById(
    "profileMenuName"
  ).textContent =
    nickname;


  document.getElementById(
    "profileMenuEmail"
  ).textContent =
    currentUser
      ? currentUser.email
      : "";
}


/* =========================================================
   打开 / 关闭个人菜单
========================================================= */

function toggleProfileMenu() {

  document
    .getElementById(
      "profileMenu"
    )
    .classList.toggle("show");
}


/* =========================================================
   点击其他位置关闭个人菜单
========================================================= */

document.addEventListener(
  "click",
  function(event) {

    const wrapper =
      document.querySelector(
        ".profile-wrapper"
      );


    if (
      wrapper &&
      !wrapper.contains(event.target)
    ) {

      document
        .getElementById(
          "profileMenu"
        )
        .classList.remove("show");
    }

  }
);


/* =========================================================
   退出登录
========================================================= */

async function logout() {

  const {
    error
  } =
    await db.auth.signOut();


  if (error) {

    console.error(error);

    showModal(
      "退出登录失败：" +
      error.message
    );

    return;
  }


  currentUser = null;

  profileMap = {};

  likedPostIds =
    new Set();


  document
    .getElementById(
      "profileMenu"
    )
    .classList.remove("show");


  showAuth();
}


/* =========================================================
   获取帖子用户昵称
========================================================= */

async function loadProfiles(
  userIds
) {

  const ids =
    [
      ...new Set(
        userIds.filter(Boolean)
      )
    ];


  if (ids.length === 0) {
    return;
  }


  const {
    data,
    error
  } =
    await db
      .from("profiles")
      .select(
        "id,nickname"
      )
      .in(
        "id",
        ids
      );


  if (error) {

    console.error(
      "加载用户资料失败：",
      error
    );

    return;
  }


  for (
    const profile
    of data || []
  ) {

    profileMap[
      profile.id
    ] =
      profile.nickname;
  }
}


/* =========================================================
   获取当前用户点赞
========================================================= */

async function loadMyLikes(
  postIds
) {

  likedPostIds =
    new Set();


  if (!currentUser) {
    return;
  }


  if (!postIds.length) {
    return;
  }


  const {
    data,
    error
  } =
    await db
      .from("likes")
      .select(
        "post_id"
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .in(
        "post_id",
        postIds
      );


  if (error) {

    console.error(
      "加载点赞失败：",
      error
    );

    return;
  }


  for (
    const like
    of data || []
  ) {

    likedPostIds.add(
      like.post_id
    );
  }
}


/* =========================================================
   加载帖子
========================================================= */

async function loadPosts() {

  const container =
    document.getElementById(
      "posts"
    );


  container.innerHTML =
    `
      <div class="loading">
        正在加载帖子...
      </div>
    `;


  try {

    const {
      data: posts,
      error: postsError
    } =
      await db
        .from("posts")
        .select(
          "id,title,content,author_id,created_at"
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (postsError) {

      console.error(
        postsError
      );


      container.innerHTML =
        `
          <div class="empty">
            帖子加载失败，请检查 Supabase 设置。
          </div>
        `;

      return;
    }


    if (!posts || posts.length === 0) {

      container.innerHTML =
        `
          <div class="empty">
            还没有帖子，来发布第一条吧 🌱
          </div>
        `;

      return;
    }


    const postIds =
      posts.map(
        post => post.id
      );


    /* 用户 */

    await loadProfiles(
      posts.map(
        post => post.author_id
      )
    );


    /* 点赞 */

    await loadMyLikes(
      postIds
    );


    /* 评论 */

    const {
      data: comments,
      error: commentsError
    } =
      await db
        .from("comments")
        .select(
          "id,post_id,content,author_id,created_at"
        )
        .in(
          "post_id",
          postIds
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );


    if (commentsError) {

      console.error(
        "评论加载失败：",
        commentsError
      );
    }


    const allComments =
      comments || [];


    await loadProfiles(
      allComments.map(
        comment =>
          comment.author_id
      )
    );


    /* 评论分类 */

    const commentsByPost = {};


    for (
      const comment
      of allComments
    ) {

      if (
        !commentsByPost[
          comment.post_id
        ]
      ) {

        commentsByPost[
          comment.post_id
        ] = [];
      }


      commentsByPost[
        comment.post_id
      ].push(comment);
    }


    /* ======================
       获取点赞数量
    ====================== */

    const {
      data: likes,
      error: likesError
    } =
      await db
        .from("likes")
        .select(
          "post_id"
        )
        .in(
          "post_id",
          postIds
        );


    if (likesError) {

      console.error(
        "点赞数量加载失败：",
        likesError
      );
    }


    const likeCounts = {};


    for (
      const like
      of likes || []
    ) {

      if (
        !likeCounts[
          like.post_id
        ]
      ) {

        likeCounts[
          like.post_id
        ] = 0;
      }


      likeCounts[
        like.post_id
      ]++;
    }


    /* ======================
       生成页面
    ====================== */

    container.innerHTML =
      posts
        .map(post => {

          const nickname =
            profileMap[
              post.author_id
            ] ||
            "未知用户";


          const postComments =
            commentsByPost[
              post.id
            ] || [];


          const likeCount =
            likeCounts[
              post.id
            ] || 0;


          const isLiked =
            likedPostIds.has(
              post.id
            );


          let commentsHTML =
            "";


          if (
            postComments.length === 0
          ) {

            commentsHTML =
              `
                <div class="time">
                  暂无评论
                </div>
              `;

          } else {

            commentsHTML =
              postComments
                .map(comment => {

                  const commentNickname =
                    profileMap[
                      comment.author_id
                    ] ||
                    "未知用户";


                  return `
                    <div class="comment">

                      <div class="comment-header">

                        <div class="avatar">
                          ${escapeHTML(
                            avatarLetter(
                              commentNickname
                            )
                          )}
                        </div>

                        <div>

                          <div class="author">
                            ${escapeHTML(
                              commentNickname
                            )}
                          </div>

                          <div class="time">
                            ${escapeHTML(
                              formatTime(
                                comment.created_at
                              )
                            )}
                          </div>

                        </div>

                      </div>

                      <div class="comment-content">
                        ${escapeHTML(
                          comment.content
                        )}
                      </div>

                    </div>
                  `;

                })
                .join("");
          }


          return `
            <article
              class="post"
            >

              <!-- 用户 -->

              <div
                class="post-header"
              >

                <div class="avatar">
                  ${escapeHTML(
                    avatarLetter(
                      nickname
                    )
                  )}
                </div>

                <div>

                  <div class="author">
                    ${escapeHTML(
                      nickname
                    )}
                  </div>

                  <div class="time">
                    ${escapeHTML(
                      formatTime(
                        post.created_at
                      )
                    )}
                  </div>

                </div>

              </div>


              <!-- 标题 -->

              <h2
                class="post-title"
              >
                ${escapeHTML(
                  post.title
                )}
              </h2>


              <!-- 内容 -->

              <div
                class="post-content"
              >
                ${escapeHTML(
                  post.content
                )}
              </div>


              <!-- 点赞 -->

              <div
                class="post-actions"
              >

                <button
                  class="like-button ${
                    isLiked
                      ? "liked"
                      : ""
                  }"
                  onclick="toggleLike('${post.id}')"
                >

                  ${
                    isLiked
                      ? "❤️"
                      : "♡"
                  }

                  <span class="like-count">
                    ${likeCount}
                  </span>

                </button>

              </div>


              <!-- 评论 -->

              <div
                class="comments"
              >

                <div
                  class="comment-input-row"
                >

                  <input
                    id="comment-${post.id}"
                    type="text"
                    maxlength="5000"
                    placeholder="${
                      currentUser
                        ? "写下你的评论..."
                        : "登录后可以发表评论"
                    }"
                    ${
                      currentUser
                        ? ""
                        : "disabled"
                    }
                  >

                  <button
                    onclick="${
                      currentUser
                        ? `createComment('${post.id}')`
                        : "showAuthMessage()"
                    }"
                  >
                    ${
                      currentUser
                        ? "发送评论"
                        : "登录评论"
                    }
                  </button>

                </div>


                ${commentsHTML}

              </div>

            </article>
          `;

        })
        .join("");


  } catch (error) {

    console.error(error);


    container.innerHTML =
      `
        <div class="empty">
          加载失败，请检查网络和 Supabase 配置。
        </div>
      `;
  }
}


/* =========================================================
   未登录提示
========================================================= */

function showAuthMessage() {

  showModal(
    "请先登录后再发表评论。"
  );
}


/* =========================================================
   发布帖子
========================================================= */

async function createPost() {

  if (!currentUser) {

    showModal(
      "请先登录。"
    );

    return;
  }


  const title =
    document
      .getElementById(
        "postTitle"
      )
      .value
      .trim();


  const content =
    document
      .getElementById(
        "postContent"
      )
      .value
      .trim();


  if (!title) {

    showModal(
      "请输入帖子标题。"
    );

    return;
  }


  if (!content) {

    showModal(
      "请输入帖子正文。"
    );

    return;
  }


  const {
    error
  } =
    await db
      .from("posts")
      .insert({

        title: title,

        content: content,

        author_id:
          currentUser.id

      });


  if (error) {

    console.error(error);

    showModal(
      "发布失败：" +
      error.message
    );

    return;
  }


  document.getElementById(
    "postTitle"
  ).value = "";


  document.getElementById(
    "postContent"
  ).value = "";


  await loadPosts();
}


/* =========================================================
   发布评论
========================================================= */

async function createComment(
  postId
) {

  if (!currentUser) {

    showModal(
      "请先登录。"
    );

    return;
  }


  const input =
    document.getElementById(
      `comment-${postId}`
    );


  if (!input) {
    return;
  }


  const content =
    input.value.trim();


  if (!content) {

    showModal(
      "请输入评论内容。"
    );

    return;
  }


  const {
    error
  } =
    await db
      .from("comments")
      .insert({

        post_id:
          postId,

        content:
          content,

        author_id:
          currentUser.id

      });


  if (error) {

    console.error(
      "评论发布失败：",
      error
    );


    showModal(
      "评论发布失败：\n\n" +
      error.message
    );

    return;
  }


  input.value = "";


  await loadPosts();
}


/* =========================================================
   点赞 / 取消点赞
========================================================= */

async function toggleLike(
  postId
) {

  if (!currentUser) {

    showModal(
      "请先登录后点赞。"
    );

    return;
  }


  /* 已点赞 → 取消 */

  if (
    likedPostIds.has(
      postId
    )
  ) {

    const {
      error
    } =
      await db
        .from("likes")
        .delete()
        .eq(
          "post_id",
          postId
        )
        .eq(
          "user_id",
          currentUser.id
        );


    if (error) {

      console.error(error);

      showModal(
        "取消点赞失败：" +
        error.message
      );

      return;
    }


    likedPostIds.delete(
      postId
    );


  } else {

    /* 没点赞 → 点赞 */

    const {
      error
    } =
      await db
        .from("likes")
        .insert({

          post_id:
            postId,

          user_id:
            currentUser.id

        });


    if (error) {

      console.error(error);

      showModal(
        "点赞失败：" +
        error.message
      );

      return;
    }


    likedPostIds.add(
      postId
    );
  }


  await loadPosts();
}


/* =========================================================
   初始化
========================================================= */

async function init() {

  const {
    data
  } =
    await db.auth.getSession();


  currentUser =
    data.session
      ? data.session.user
      : null;


  if (currentUser) {

    await loadCurrentProfile();

    showForum();

  } else {

    showAuth();
  }


  /* 监听登录状态 */

  db.auth.onAuthStateChange(
    async (
      _event,
      session
    ) => {

      currentUser =
        session
          ? session.user
          : null;


      if (currentUser) {

        await loadCurrentProfile();

        updateProfileButton();

      }

    }
  );
}


/* 启动 */

init();

</script>
