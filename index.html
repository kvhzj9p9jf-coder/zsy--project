<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎭 角色群聊 · 朋友圈</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }
    body {
      background: #141824;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }
    .app {
      max-width: 1300px;
      width: 100%;
      background: rgba(24, 29, 44, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 40px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
      padding: 20px 20px 24px;
      border: 1px solid rgba(255,255,255,0.04);
    }
    h1 {
      color: #edeff7;
      font-size: 1.7rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 1px solid #2d344b;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }
    h1 small {
      font-size: 0.85rem;
      font-weight: 400;
      color: #8f9bbd;
      margin-left: auto;
      background: #252c42;
      padding: 4px 16px;
      border-radius: 40px;
    }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    /* 左侧角色面板 */
    .left-panel {
      flex: 1.2;
      min-width: 270px;
      background: #1b2134;
      border-radius: 28px;
      padding: 18px 14px 20px;
      border: 1px solid #2b324b;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.4);
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #b7c2e6;
      font-weight: 500;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }
    .panel-header button {
      background: #4a5880;
      border: none;
      color: white;
      padding: 4px 16px;
      border-radius: 30px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.15s;
      font-weight: 500;
    }
    .panel-header button:hover { background: #6679aa; }
    .char-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 500px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .char-list::-webkit-scrollbar { width: 4px; }
    .char-list::-webkit-scrollbar-thumb { background: #3d4a6b; border-radius: 10px; }

    .char-card {
      background: #232b42;
      border-radius: 18px;
      padding: 14px 14px 12px;
      border-left: 4px solid #6578b0;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
      cursor: pointer;
      transition: 0.1s;
    }
    .char-card.active { border-left-color: #f5c542; background: #2e3653; }
    .char-card .name {
      font-weight: 600;
      color: #eef3ff;
      font-size: 1.1rem;
      display: flex;
      justify-content: space-between;
    }
    .char-card .name small { font-weight: 400; font-size: 0.7rem; color: #96a2c9; }
    .char-card .traits {
      font-size: 0.75rem;
      color: #b4c0e6;
      background: #1a2136;
      padding: 2px 12px;
      border-radius: 30px;
      display: inline-block;
      margin: 6px 0 4px;
    }
    .char-card .detail {
      font-size: 0.8rem;
      color: #b9c5ec;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-top: 4px;
    }
    .char-card .detail span { background: #171e32; padding: 0 12px; border-radius: 30px; }
    .char-card .backstory {
      font-size: 0.8rem;
      color: #c8d2f0;
      background: #171e32;
      padding: 6px 12px;
      border-radius: 14px;
      margin-top: 6px;
      border-left: 2px solid #4f6190;
    }
    .char-actions {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      justify-content: flex-end;
    }
    .char-actions button {
      background: transparent;
      border: none;
      color: #a9b8e0;
      font-size: 0.8rem;
      padding: 2px 12px;
      border-radius: 30px;
      cursor: pointer;
    }
    .char-actions .del:hover { background: #5e3344; color: #ff9e9e; }
    .char-actions .edit:hover { background: #2f3d64; color: #d6e2ff; }

    /* 中间聊天 + 右侧朋友圈 */
    .right-wrap {
      flex: 3;
      min-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }
    .chat-area {
      background: #181f32;
      border-radius: 28px;
      padding: 16px 16px 12px;
      border: 1px solid #2a314b;
      height: 420px;
      display: flex;
      flex-direction: column;
    }
    .chat-mode {
      display: flex;
      gap: 10px;
      margin-bottom: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .chat-mode button {
      background: #2d3653;
      border: none;
      color: #bcc7ee;
      padding: 4px 16px;
      border-radius: 40px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.1s;
    }
    .chat-mode button.active { background: #4f6190; color: white; }
    .chat-mode select {
      background: #1f263e;
      border: 1px solid #3f4b70;
      color: #e6edff;
      padding: 4px 12px;
      border-radius: 40px;
      font-size: 0.8rem;
      outline: none;
    }
    .chat-msgs {
      flex: 1;
      overflow-y: auto;
      padding-right: 4px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .chat-msgs::-webkit-scrollbar { width: 4px; }
    .chat-msgs::-webkit-scrollbar-thumb { background: #3d4a6b; border-radius: 10px; }

    .msg {
      background: #232b44;
      border-radius: 18px 18px 18px 4px;
      padding: 10px 14px;
      border-left: 3px solid #6e82ba;
    }
    .msg .sender { font-weight: 600; color: #d3defa; font-size: 0.9rem; }
    .msg .content { color: #f0f5ff; margin-top: 4px; word-break: break-word; }
    .msg .time { font-size: 0.6rem; color: #7a88b0; text-align: right; margin-top: 4px; }

    .chat-input {
      display: flex;
      gap: 8px;
      background: #0f1526;
      padding: 4px 4px 4px 16px;
      border-radius: 60px;
      border: 1px solid #2f3857;
    }
    .chat-input select { background: #1b233b; border: none; color: #dae2ff; padding: 6px 12px; border-radius: 40px; font-size: 0.8rem; outline: none; min-width: 100px; }
    .chat-input input { flex:1; background: transparent; border: none; padding: 8px 4px; color: #f0f5ff; outline: none; font-size: 0.95rem; }
    .chat-input input::placeholder { color: #5d6b92; }
    .chat-input button { background: #5a6b92; border: none; border-radius: 40px; padding: 6px 20px; color: white; font-weight: 600; cursor: pointer; transition: 0.15s; }
    .chat-input button:hover { background: #7488b5; }

    /* 朋友圈 */
    .moment-area {
      background: #181f32;
      border-radius: 28px;
      padding: 16px 16px 12px;
      border: 1px solid #2a314b;
      max-height: 320px;
      display: flex;
      flex-direction: column;
    }
    .moment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #b7c2e6;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .moment-header button {
      background: #3f4d72;
      border: none;
      color: white;
      padding: 2px 16px;
      border-radius: 30px;
      font-size: 0.75rem;
      cursor: pointer;
    }
    .moment-list {
      flex:1;
      overflow-y: auto;
      max-height: 200px;
      padding-right: 4px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .moment-list::-webkit-scrollbar { width: 4px; }
    .moment-list::-webkit-scrollbar-thumb { background: #3d4a6b; border-radius: 10px; }

    .moment-item {
      background: #20293f;
      border-radius: 18px;
      padding: 10px 14px;
      border-left: 3px solid #b3a0d6;
    }
    .moment-item .m-name { font-weight: 600; color: #d1dbfa; font-size: 0.9rem; }
    .moment-item .m-text { color: #eef3ff; margin-top: 4px; font-size: 0.9rem; }
    .moment-item .m-time { font-size: 0.6rem; color: #7a88b0; text-align: right; }

    /* modal */
    .modal {
      display: none;
      position: fixed;
      top:0;left:0;width:100%;height:100%;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: #252d47;
      max-width: 420px;
      width: 90%;
      padding: 28px 24px 32px;
      border-radius: 36px;
      border: 1px solid #3f4a6e;
      color: #e8efff;
    }
    .modal-box h2 { margin-bottom: 16px; font-weight: 500; }
    .modal-box label { display: block; font-size: 0.8rem; color: #b1bedf; margin-top: 14px; }
    .modal-box input, .modal-box textarea {
      width: 100%;
      background: #171f32;
      border: 1px solid #3d4668;
      border-radius: 24px;
      padding: 10px 16px;
      color: #f0f5ff;
      font-size: 0.95rem;
      margin-top: 4px;
      outline: none;
    }
    .modal-box textarea { min-height: 60px; resize: vertical; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
    .modal-actions button { background: #3d4768; border: none; color: white; padding: 8px 22px; border-radius: 40px; cursor: pointer; }
    .modal-actions .primary { background: #657bb0; }
    .modal-actions .primary:hover { background: #7d96cf; }

    @media (max-width: 780px) {
      .right-wrap { min-width: unset; }
    }
  </style>
</head>
<body>
<div class="app">
  <h1>🎭 群聊·朋友圈 <small>自定义角色 · 按设定发言</small></h1>
  <div class="grid">
    <!-- 左：角色列表 -->
    <div class="left-panel">
      <div class="panel-header"><span>📋 角色</span><button id="addCharBtn">+ 新建</button></div>
      <div class="char-list" id="charList"></div>
    </div>

    <!-- 右：聊天 + 朋友圈 -->
    <div class="right-wrap">
      <!-- 聊天 -->
      <div class="chat-area">
        <div class="chat-mode">
          <button id="groupChatBtn" class="active">💬 群聊</button>
          <button id="privateChatBtn">🔒 私聊</button>
          <select id="privateTargetSelect" style="display:none; min-width:100px;"><option value="">选择私聊对象</option></select>
          <span style="color:#7e8bb0; font-size:0.7rem; margin-left:auto;">点击角色卡设为发言者</span>
        </div>
        <div class="chat-msgs" id="chatMsgs"></div>
        <div class="chat-input">
          <select id="speakerSelect"><option value="">— 发言角色 —</option></select>
          <input type="text" id="chatInput" placeholder="输入消息…" />
          <button id="sendBtn">发送</button>
        </div>
      </div>
      <!-- 朋友圈 -->
      <div class="moment-area">
        <div class="moment-header"><span>📱 朋友圈 · 按性格发言</span><button id="addMomentBtn">+ 发动态</button></div>
        <div class="moment-list" id="momentList"></div>
      </div>
    </div>
  </div>
</div>

<!-- 模态框：角色编辑 -->
<div class="modal" id="charModal">
  <div class="modal-box">
    <h2 id="modalTitle">✨ 角色</h2>
    <label>名称</label><input type="text" id="cName" placeholder="林汐" />
    <label>性格 (影响发言风格)</label><input type="text" id="cPersonality" placeholder="温柔、毒舌、冷静…" />
    <label>外貌</label><input type="text" id="cAppearance" placeholder="黑发碧眼" />
    <label>身高</label><input type="text" id="cHeight" placeholder="165cm" />
    <label>经历</label><textarea id="cBackstory" placeholder="曾经…"></textarea>
    <div class="modal-actions"><button id="modalCancel">取消</button><button class="primary" id="modalSave">保存</button></div>
  </div>
</div>

<script>
  (function() {
    // ---- 数据 ----
    let chars = [];
    let nextId = 1;
    let chatLog = [];           // { sender, content, time, private?: bool, target?: string }
    let moments = [];           // { sender, text, time }
    let currentSpeakerId = null;
    let isPrivateMode = false;
    let privateTargetId = null; // 私聊目标角色id

    // DOM
    const charListEl = document.getElementById('charList');
    const chatMsgsEl = document.getElementById('chatMsgs');
    const speakerSelect = document.getElementById('speakerSelect');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');
    const addCharBtn = document.getElementById('addCharBtn');
    const groupChatBtn = document.getElementById('groupChatBtn');
    const privateChatBtn = document.getElementById('privateChatBtn');
    const privateTargetSelect = document.getElementById('privateTargetSelect');
    const momentListEl = document.getElementById('momentList');
    const addMomentBtn = document.getElementById('addMomentBtn');

    // modal
    const modal = document.getElementById('charModal');
    const modalTitle = document.getElementById('modalTitle');
    const cName = document.getElementById('cName');
    const cPersonality = document.getElementById('cPersonality');
    const cAppearance = document.getElementById('cAppearance');
    const cHeight = document.getElementById('cHeight');
    const cBackstory = document.getElementById('cBackstory');
    const modalCancel = document.getElementById('modalCancel');
    const modalSave = document.getElementById('modalSave');
    let editingId = null;

    // ---- 工具 ----
    function timeStr() {
      const d = new Date();
      return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
    }

    // 根据角色设定生成回复 (不ooc)
    function generateReply(char, userMsg) {
      if (!char) return '……';
      const p = (char.personality || '普通').toLowerCase();
      let reply = '';
      if (p.includes('温柔') || p.includes('细腻') || p.includes('善解')) {
        reply = `“${char.name}” 轻轻地说：「${userMsg}… 我明白，一切都会好的。」`;
      } else if (p.includes('毒舌') || p.includes('傲娇') || p.includes('讽刺')) {
        reply = `“${char.name}” 嗤笑一声：「${userMsg}？你可真会开玩笑。」`;
      } else if (p.includes('活泼') || p.includes('热情') || p.includes('开朗')) {
        reply = `“${char.name}” 兴奋地拍手：「${userMsg}！太棒啦！我也这样想！」`;
      } else if (p.includes('冷静') || p.includes('理性')) {
        reply = `“${char.name}” 推了推眼镜：「${userMsg}… 从逻辑上确实如此。」`;
      } else {
        reply = `“${char.name}” 想了想，说道：「${userMsg}… 嗯，有道理。」`;
      }
      if (char.appearance && Math.random() > 0.7) reply += ` (${char.appearance.slice(0,10)}…)`;
      return reply;
    }

    // 生成朋友圈动态 (按性格)
    function generateMoment(char) {
      if (!char) return '今天天气不错。';
      const p = (char.personality || '普通').toLowerCase();
      const texts = [];
      if (p.includes('温柔')) texts.push('窗外的花开了，好想分享给你。', '今天泡了一杯茉莉花茶，心静。');
      if (p.includes('毒舌')) texts.push('今天的咖啡真难喝，不如我自己烘的。', '某些人真的没救了。');
      if (p.includes('活泼')) texts.push('哇！今天遇到一只超可爱的猫！！', '蹦蹦跳跳的一天！');
      if (p.includes('冷静')) texts.push('观察数据，发现一个有趣的现象。', '理性分析，一切皆可解。');
      if (texts.length === 0) texts.push('今天也是平凡的一天。', '嗯，记录一下。');
      return texts[Math.floor(Math.random() * texts.length)];
    }

    // ---- 渲染 ----
    function renderChars() {
      if (chars.length === 0) {
        charListEl.innerHTML = `<div style="color:#6a789a;padding:20px;text-align:center;">还没有角色</div>`;
        return;
      }
      let html = '';
      chars.forEach(c => {
        const active = (c.id === currentSpeakerId) ? 'active' : '';
        html += `
          <div class="char-card ${active}" data-id="${c.id}">
            <div class="name">${c.name} <small>#${c.id}</small></div>
            <div class="traits">🧠 ${c.personality || '未设定'}</div>
            <div class="detail"><span>👤 ${c.appearance || '—'}</span><span>📏 ${c.height || '—'}</span></div>
            <div class="backstory">📖 ${c.backstory || '暂无'}</div>
            <div class="char-actions">
              <button class="edit" data-id="${c.id}">✎</button>
              <button class="del" data-id="${c.id}">✕</button>
            </div>
          </div>
        `;
      });
      charListEl.innerHTML = html;
      // 绑定点击卡片 -> 设为当前发言者
      charListEl.querySelectorAll('.char-card').forEach(el => {
        el.addEventListener('click', function(e) {
          if (e.target.closest('button')) return;
          const id = parseInt(this.dataset.id);
          setCurrentSpeaker(id);
        });
      });
      // 删除/编辑
      charListEl.querySelectorAll('.del').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const id = parseInt(this.dataset.id);
          if (confirm('删除该角色？')) deleteChar(id);
        });
      });
      charListEl.querySelectorAll('.edit').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const id = parseInt(this.dataset.id);
          openModal(id);
        });
      });
      updateSpeakerSelect();
      updatePrivateTargets();
    }

    function setCurrentSpeaker(id) {
      currentSpeakerId = id;
      renderChars();
      if (speakerSelect) speakerSelect.value = id;
    }

    function updateSpeakerSelect() {
      speakerSelect.innerHTML = '<option value="">— 发言角色 —</option>';
      chars.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        if (c.id === currentSpeakerId) opt.selected = true;
        speakerSelect.appendChild(opt);
      });
      if (currentSpeakerId && !chars.some(c=>c.id===currentSpeakerId)) {
        currentSpeakerId = chars.length? chars[0].id : null;
        if (currentSpeakerId) speakerSelect.value = currentSpeakerId;
      } else if (!currentSpeakerId && chars.length) {
        currentSpeakerId = chars[0].id;
        speakerSelect.value = currentSpeakerId;
      }
    }

    function updatePrivateTargets() {
      privateTargetSelect.innerHTML = '<option value="">选择私聊对象</option>';
      chars.forEach(c => {
        if (c.id === currentSpeakerId) return;
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        privateTargetSelect.appendChild(opt);
      });
      if (privateTargetId && !chars.some(c=>c.id===privateTargetId)) {
        privateTargetId = null;
      }
      if (privateTargetId) privateTargetSelect.value = privateTargetId;
      else privateTargetSelect.value = '';
    }

    // 渲染聊天
    function renderChat() {
      if (chatLog.length === 0) {
        chatMsgsEl.innerHTML = `<div style="color:#6a789a;text-align:center;padding:30px 0;">💬 开始聊天吧</div>`;
        return;
      }
      let html = '';
      let filtered = chatLog;
      if (isPrivateMode && privateTargetId) {
        const target = chars.find(c=>c.id===privateTargetId);
        if (target) {
          filtered = chatLog.filter(m => 
            (m.sender === target.name || m.sender === (chars.find(c=>c.id===currentSpeakerId)?.name || '')) &&
            (m.private === true && m.target === target.name)
          );
        } else filtered = [];
      } else {
        // 群聊模式：过滤掉私聊消息
        filtered = chatLog.filter(m => !m.private);
      }
      if (filtered.length === 0) {
        chatMsgsEl.innerHTML = `<div style="color:#6a789a;text-align:center;padding:20px 0;">暂无消息</div>`;
        return;
      }
      filtered.forEach(m => {
        html += `
          <div class="msg">
            <div class="sender">${m.sender}</div>
            <div class="content">${m.content}</div>
            <div class="time">${m.time || ''}</div>
          </div>
        `;
      });
      chatMsgsEl.innerHTML = html;
      chatMsgsEl.scrollTop = chatMsgsEl.scrollHeight;
    }

    // 渲染朋友圈
    function renderMoments() {
      if (moments.length === 0) {
        momentListEl.innerHTML = `<div style="color:#6a789a;text-align:center;padding:10px 0;">暂无动态</div>`;
        return;
      }
      let html = '';
      moments.slice().reverse().forEach(m => {
        html += `
          <div class="moment-item">
            <div class="m-name">${m.sender}</div>
            <div class="m-text">${m.text}</div>
            <div class="m-time">${m.time || ''}</div>
          </div>
        `;
      });
      momentListEl.innerHTML = html;
    }

    // ---- 操作 ----
    function deleteChar(id) {
      if (chars.length <= 1) { alert('至少保留一个角色'); return; }
      chars = chars.filter(c => c.id !== id);
      if (currentSpeakerId === id) {
        currentSpeakerId = chars.length? chars[0].id : null;
      }
      if (privateTargetId === id) privateTargetId = null;
      renderChars();
      renderChat();
    }

    function openModal(id=null) {
      editingId = id;
      if (id === null) {
        modalTitle.textContent = '✨ 新建角色';
        cName.value = ''; cPersonality.value = ''; cAppearance.value = ''; cHeight.value = ''; cBackstory.value = '';
      } else {
        const c = chars.find(ch => ch.id === id);
        if (!c) return;
        modalTitle.textContent = `✎ 编辑 ${c.name}`;
        cName.value = c.name;
        cPersonality.value = c.personality || '';
        cAppearance.value = c.appearance || '';
        cHeight.value = c.height || '';
        cBackstory.value = c.backstory || '';
      }
      modal.classList.add('open');
    }

    function closeModal() { modal.classList.remove('open'); editingId = null; }

    function saveChar() {
      const name = cName.value.trim();
      if (!name) { alert('请输入名称'); return; }
      const personality = cPersonality.value.trim() || '未设定';
      const appearance = cAppearance.value.trim() || '未设定';
      const height = cHeight.value.trim() || '未设定';
      const backstory = cBackstory.value.trim() || '暂无经历';

      if (editingId !== null) {
        const idx = chars.findIndex(c => c.id === editingId);
        if (idx !== -1) {
          chars[idx] = { ...chars[idx], name, personality, appearance, height, backstory };
        }
      } else {
        const newChar = { id: nextId++, name, personality, appearance, height, backstory };
        chars.push(newChar);
        currentSpeakerId = newChar.id;
      }
      closeModal();
      renderChars();
      renderChat();
      renderMoments();
      updatePrivateTargets();
    }

    // 发送消息 (群聊/私聊)
    function sendMessage() {
      const speakerId = parseInt(speakerSelect.value);
      if (!speakerId) { alert('请选择发言角色'); return; }
      const char = chars.find(c => c.id === speakerId);
      if (!char) { alert('角色不存在'); return; }
      const userMsg = chatInput.value.trim();
      if (!userMsg) { alert('输入消息'); return; }

      let targetName = null;
      let isPrivate = false;
      if (isPrivateMode && privateTargetId) {
        const target = chars.find(c => c.id === privateTargetId);
        if (target) { targetName = target.name; isPrivate = true; }
        else { alert('请选择私聊对象'); return; }
      }

      // 用户消息 (显示触发)
      const time = timeStr();
      chatLog.push({ sender: '你', content: userMsg, time, private: isPrivate, target: targetName });

      // 角色回复
      const reply = generateReply(char, userMsg);
      chatLog.push({ sender: char.name, content: reply, time: timeStr(), private: isPrivate, target: targetName });

      chatInput.value = '';
      renderChat();
      // 切换高亮
      setCurrentSpeaker(char.id);
      updatePrivateTargets();
    }

    // 发布朋友圈 (由当前发言角色发布)
    function addMoment() {
      if (!currentSpeakerId) { alert('请先选择一个角色'); return; }
      const char = chars.find(c => c.id === currentSpeakerId);
      if (!char) return;
      const text = generateMoment(char);
      moments.push({ sender: char.name, text, time: timeStr() });
      renderMoments();
    }

    // ---- 模式切换 ----
    function setGroupMode() {
      isPrivateMode = false;
      privateTargetId = null;
      groupChatBtn.classList.add('active');
      privateChatBtn.classList.remove('active');
      privateTargetSelect.style.display = 'none';
      renderChat();
    }
    function setPrivateMode() {
      isPrivateMode = true;
      privateChatBtn.classList.add('active');
      groupChatBtn.classList.remove('active');
      privateTargetSelect.style.display = 'inline-block';
      if (!privateTargetId) {
        const first = chars.find(c => c.id !== currentSpeakerId);
        if (first) privateTargetId = first.id;
      }
      privateTargetSelect.value = privateTargetId || '';
      renderChat();
    }

    // ---- 初始化 ----
    function initDefault() {
      chars = [
        { id: nextId++, name: '林汐', personality: '温柔细腻，善解人意', appearance: '黑长直发，琥珀眼眸', height: '165cm', backstory: '山村支教三年，爱植物' },
        { id: nextId++, name: '陆沉', personality: '毒舌傲娇，内心正直', appearance: '银灰短发，黑曜石耳钉', height: '188cm', backstory: '前黑客，现咖啡馆老板' },
        { id: nextId++, name: '苏晚', personality: '热情活泼，乐观开朗', appearance: '金色卷发，雀斑脸', height: '158cm', backstory: '独立音乐人，爱旅行' },
      ];
      currentSpeakerId = chars[0].id;
      chatLog = [
        { sender: '林汐', content: '今天院子里开了第一朵茉莉，好香啊。', time: '10:23' },
        { sender: '陆沉', content: '哼，花有什么好闻的，不如咖啡豆。', time: '10:25' },
        { sender: '苏晚', content: '哇！茉莉！我要去看！', time: '10:26' },
      ];
      moments = [
        { sender: '林汐', text: '茉莉花开了，岁月静好。', time: '10:30' },
        { sender: '陆沉', text: '今天的豆子烘焙度刚好，完美。', time: '10:35' },
        { sender: '苏晚', text: '新写了一首歌，好开心！！', time: '10:40' },
      ];
    }
    initDefault();

    // ---- 绑定事件 ----
    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); sendMessage(); } });
    addCharBtn.addEventListener('click', () => openModal(null));
    modalCancel.addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
    modalSave.addEventListener('click', saveChar);
    groupChatBtn.addEventListener('click', setGroupMode);
    privateChatBtn.addEventListener('click', setPrivateMode);
    privateTargetSelect.addEventListener('change', function() {
      privateTargetId = parseInt(this.value) || null;
      renderChat();
    });
    addMomentBtn.addEventListener('click', addMoment);

    // 下拉选择变化同步高亮
    speakerSelect.addEventListener('change', function() {
      const val = parseInt(this.value);
      if (val) setCurrentSpeaker(val);
    });

    // 初次渲染
    function init() {
      renderChars();
      renderChat();
      renderMoments();
      updatePrivateTargets();
      if (chars.length) {
        currentSpeakerId = chars[0].id;
        speakerSelect.value = currentSpeakerId;
        renderChars();
      }
      setGroupMode(); // 默认群聊
    }
    init();
  })();
</script>
</body>
</html>
